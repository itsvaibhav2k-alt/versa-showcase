appId: com.vaibhavmaddhi.versa
name: Call Initiate Flow - Real Retell
---
- runFlow: setup-login.yaml
- waitForAnimationToEnd:
    timeout: 10000

# Dismiss any open modal (e.g., from previous test)
- tapOn:
    id: "cancel-compose-btn"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000

# Navigate home first to reset state
- tapOn:
    point: "10%,97%"
- waitForAnimationToEnd:
    timeout: 3000

# Navigate to Comms tab
- tapOn:
    point: "70%,97%"
- waitForAnimationToEnd:
    timeout: 5000

# Make sure we're on the Calls sub-tab (already default, but tap to confirm)
- tapOn:
    label: "Calls"
- waitForAnimationToEnd:
    timeout: 3000

# Tap the Quick Call input field
- tapOn:
    label: "Who should Versa call?"
- inputText: "Test Contact"

# Press enter to submit (triggers onSubmitEditing)
- pressKey: Enter
- waitForAnimationToEnd:
    timeout: 5000

# Pre-call bottom sheet should appear
- assertVisible:
    label: ".*Test Contact.*"
    optional: true

# Assert call type options
- assertVisible:
    label: "AI Call"
    optional: true
- assertVisible:
    label: "Direct Call"
    optional: true

# Wait for bottom sheet to fully render
- waitForAnimationToEnd:
    timeout: 3000

# Tap Start Call
- tapOn:
    label: "Start Call"
- waitForAnimationToEnd:
    timeout: 8000

# Verify calling toast
- assertVisible:
    label: ".*Calling.*"
    optional: true
