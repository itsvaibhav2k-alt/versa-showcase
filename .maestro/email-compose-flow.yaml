appId: com.vaibhavmaddhi.versa
name: Email Compose Flow
---
- runFlow: setup-login.yaml
- waitForAnimationToEnd:
    timeout: 10000

# The "Email" quick action now routes to /(tabs)/comms?tab=emails (Comms tab)
# not directly to the compose modal. The email-compose modal is accessed from Comms.
# For this flow, we test the compose modal by navigating directly.
# First navigate to Comms tab via the Email quick action
- assertVisible:
    label: ".*Email.*"
- tapOn:
    label: "Email"
- waitForAnimationToEnd:
    timeout: 5000

# The Comms tab should be visible now with email inbox
# Look for compose button/FAB on the comms screen to open compose modal
# If compose is accessible from comms, tap it
- tapOn:
    label: "Compose"
    optional: true
- waitForAnimationToEnd:
    timeout: 5000

# Assert compose email modal elements
# Heading: "Compose Email"
- assertVisible:
    label: "Compose Email"
    optional: true

# Assert tone options
- assertVisible:
    label: "Professional"
    optional: true
- assertVisible:
    label: "Friendly"
    optional: true
- assertVisible:
    label: "Urgent"
    optional: true

# Primary action button is now "Preview Draft" (was "Generate & Send")
- assertVisible:
    label: "Preview Draft"
    optional: true

# Secondary action button
- assertVisible:
    label: "Send Directly"
    optional: true

# Test the preview flow — tap Preview Draft button
- tapOn:
    label: "Preview Draft"
    optional: true
- waitForAnimationToEnd:
    timeout: 10000

# If preview loaded, verify preview phase elements
- assertVisible:
    label: "Preview"
    optional: true
- assertVisible:
    label: "AI DRAFT"
    optional: true

# Verify Send Email button exists in preview phase
- assertVisible:
    label: "Send Email"
    optional: true

# Verify Back to Edit option exists
- assertVisible:
    label: "Back to Edit"
    optional: true

# Cancel to go back
- tapOn:
    label: "Cancel"
    optional: true
