appId: com.vaibhavmaddhi.versa
name: Settings Integrations
---
- runFlow: setup-login.yaml
- waitForAnimationToEnd:
    timeout: 10000
# Navigate to Settings tab (coordinate tap — text taps don't trigger nav in Expo Go)
- tapOn:
    point: "90%,97%"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    label: "Settings"
# FlatRows with bare 20px Lucide icons (no colored circle bg)
- assertVisible:
    label: "Calendar Sync"
- assertVisible:
    label: "Email Accounts"
# Status text as plain colored text (not pill badge)
- assertVisible:
    label: "2 Active"
- assertVisible:
    label: "Phone Configuration"
- assertVisible:
    label: "Voice Assistant"
# Webhooks row
- assertVisible:
    label: "Webhooks n8n"
- swipe:
    start: "50%,70%"
    end: "50%,30%"
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    label: "Sign Out"
- assertVisible:
    label: "2.0.1"
